name: Holo v11 Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holo-v11-verify:
    name: Verify Repository Structure (Holo v11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify structure and emit Holo v11 summary
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md || test -f readme.md
          test -d .github/workflows
          WF_COUNT=$(find .github/workflows -maxdepth 1 -type f | wc -l)
          echo "Holo v11 structure verified for vllm (workflows: ${WF_COUNT})"
          {
            printf '### Holo v11 Repository Check — vllm\n\n'
            printf -- '- **Branch:** `main`\n'
            printf -- '- **Workflow Count:** `%s`\n' "${WF_COUNT}"
            printf -- '- **Status:** Structure verified (Holo v11 unified)\n'
          } >> "$GITHUB_STEP_SUMMARY"
